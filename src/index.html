<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proyecto Visualización 3D - Tenerife</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
    margin: 0;
    overflow: hidden;
    height: 100%;
    font-family: Arial, sans-serif;
    background-color: #222;
    color: white;
   }

  #app-container {
    display: flex;
    flex-direction: row;
    width: 100vw;
    height: 100vh;
  }

  /* --- Mapa --- */
  #canvas-container {
    flex-grow: 1;
    position: relative;
    min-width: 0;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* --- Paneles laterales --- */
  #sidebar-left, #legend-container {
    flex-shrink: 0;
    background: #1a1a1a;
    transition: flex-basis 0.3s ease;
    overflow: hidden;
    position: relative;
  }

  #sidebar-left {
    flex-basis: 300px;
    min-width: 0;
    border-right: 1px solid #444;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  #legend-container {
    flex-basis: 250px;
    min-width: 0;
    border-left: 1px solid #444;
    overflow-y: auto;
    padding: 15px;
    box-sizing: border-box;
  }

  #sidebar-left.collapsed, #legend-container.collapsed {
    flex-basis: 0 !important;
    border: none;
    padding: 0;
  }
  #sidebar-left.collapsed > *, #legend-container.collapsed > * {
    display: none;
  }

  #sidebar-content {
    flex-grow: 1;
    overflow-y: auto;
    padding: 15px;
  }

  .sidebar-button {
    background-color: #0099ff;
    color: white;
    border: none;
    padding: 8px 12px;
    margin-bottom: 15px;
    width: 100%;
    cursor: pointer;
    border-radius: 4px;
    font-size: 0.9em;
    transition: background-color 0.2s;
  }
  .sidebar-button:hover {
    background-color: #00b3ff;
  }

  #sidebar-left h3 {
    margin-top: 0; color: #0099ff; border-bottom: 1px solid #333; padding-bottom: 10px;
  }
  #sidebar-left .info-item { margin-bottom: 8px; }
  #sidebar-left .info-item strong { display: block; color: #adadad; font-size: 0.9em; margin-bottom: 2px; }
  #sidebar-placeholder { color: #808080; font-style: italic; }
  #sidebar-left .info-item a { color: #00aaff; text-decoration: none; word-wrap: break-word; }
  #sidebar-left .info-item a:hover { text-decoration: underline; }
  #sidebar-footer {
    flex-shrink: 0; padding: 10px 15px; background: #111; border-top: 1px solid #444; font-size: 0.9em; color: #bdbdbd; text-align: left;
}

  /* --- Conenido de la leyenda --- */
  #legend-container h3 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
  .legend-item { display: flex; align-items: center; margin-bottom: 10px; cursor: pointer; padding: 5px; border-radius: 4px; transition: background-color 0.2s; }
  .legend-item:hover { background-color: #333; }
  .legend-item.active { background-color: #0099ff; color: white; }
  .legend-item.all-button { background-color: #555; justify-content: center; font-weight: bold; }
  .color-swatch { width: 15px; height: 15px; border: 1px solid #fff; margin-right: 10px; flex-shrink: 0; }

  .resizer {
    flex-basis: 1.2px; /* Ancho de la barra */
    flex-shrink: 0;
    background: #333;
    cursor: col-resize;
    position: relative;
    z-index: 5;
  }
  .resizer:hover {
    background: #555;
  }

  .sidebar-toggle {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 16px;
    height: 30px;
    background: #666;
    color: white;
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    line-height: 30px;
  }
  .sidebar-toggle:hover {
    background: #0099ff;
  }

  /* --- Pantalla de carga --- */
  #loader-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(34, 34, 34, 0.9); display: flex; justify-content: center;
    align-items: center; font-size: 2em; z-index: 1000;
  }

  /* --- Control para diseño responsive */
  @media (max-width: 800px) {
    #app-container { flex-direction: column-reverse; }
    #sidebar-left, #legend-container {
      flex-basis: 150px !important; /* Importante para sobreescribir el 'style' del JS */
      width: 100%;
      box-sizing: border-box;
    }
    #sidebar-left { border-right: none; border-top: 1px solid #444; }
    #legend-container { flex-basis: auto !important; border-left: none; border-bottom: 1px solid #444; }
  
    /* Ocultar resizers en móvil */
    .resizer { display: none; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
    "three/examples/jsm/controls/MapControls.js": "https://unpkg.com/three@0.164.1/examples/jsm/controls/MapControls.js"
  }
}
</script>

<script type="module" src="main.js"></script>

</head>
<body>

  <div id="app-container">
  
    <div id="sidebar-left">
      <div id="sidebar-content">
        <div id="sidebar-placeholder">Haz clic en un punto del mapa para ver su información.</div>
      </div>
      <div id="sidebar-footer">
        Iván Pérez Díaz
      </div>
    </div>

  <div class="resizer" id="resizer-left">
    <div class="sidebar-toggle" id="toggle-left">«</div>
  </div>
  
  <div id="canvas-container"></div>
  
  <div class="resizer" id="resizer-right">
    <div class="sidebar-toggle" id="toggle-right">»</div>
  </div>

  <div id="legend-container">
    <h3>Leyenda</h3>
    <div id="legend-content"></div>
  </div>

  </div>

<div id="loader-overlay">Cargando modelos...</div>

</body>
</html>
