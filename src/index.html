<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proyecto Visualización 3D - Tenerife</title>
  <style>
    /* Reseteo básico para que el canvas ocupe todo */
    body {
      margin: 0;
      overflow: hidden;
      background-color: rgb(0, 0, 0); /* Fondo oscuro */
    }
    canvas {
      display: block;
    }
    /* Estilos para el "cargando..." */
    #loader-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(59, 209, 219, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-family: sans-serif;
      font-size: 2em;
      z-index: 10;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
      "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.164.1/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>

  <script type="module" src="PKs_Tenerife.js"></script>

</head>
<body>

  <div id="loader-overlay">Cargando modelos...</div>

</body>
</html>
