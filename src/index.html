<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Proyecto Visualización 3D - Tenerife</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
    </script>
  </head>
  <body>
    <div id="app-container">
      <div id="sidebar-left">
        <div id="sidebar-content">
          <div id="sidebar-placeholder">
            Haz clic en un punto del mapa para ver su información.
          </div>
        </div>
        <div id="sidebar-footer">Iván Pérez Díaz</div>
      </div>

      <div class="resizer" id="resizer-left">
        <div class="sidebar-toggle" id="toggle-left">«</div>
      </div>

      <div id="canvas-container"></div>

      <div class="resizer" id="resizer-right">
        <div class="sidebar-toggle" id="toggle-right">»</div>
      </div>

      <div id="legend-container">
        <div id="legend-wrapper">
          <h3>Leyenda</h3>
          <div id="legend-content"></div>
        </div>
      </div>

      <div id="loader-overlay">Cargando modelos...</div>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
